name: Build & Release Dr. Astro (Capacitor & Flutter)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Capacitor Android App
  # ─────────────────────────────────────────────────────────────────────────────
  build-capacitor:
    name: 📱 Build Capacitor Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Capacitor Assets (Icons & Splash)
        run: npx @capacitor/assets generate --android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Next.js & Capacitor Sync
        run: npm run build-mobile

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Capacitor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Flutter Android App
  # ─────────────────────────────────────────────────────────────────────────────
  build-flutter-android:
    name: 🤖 Build Flutter Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Generate Splash Screen
        run: flutter pub run flutter_native_splash:create

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: flutter_app/build/app/outputs/apk/release/app-release.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Windows Desktop EXE via Electron (from Next.js web app)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build Windows Desktop (Electron)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Next.js (static export)
        run: npm run build

      - name: Install Electron Builder
        run: npm install --save-dev electron electron-builder concurrently wait-on --legacy-peer-deps

      - name: Build Windows EXE with Electron Builder
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-electron/*.exe

  # ─────────────────────────────────────────────────────────────────────────────
  # Create Consolidated GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Publish Release
    needs: [build-capacitor, build-flutter-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Capacitor APK
        uses: actions/download-artifact@v4
        with:
          name: capacitor-apk
          path: dist/

      - name: Download Flutter APK
        uses: actions/download-artifact@v4
        with:
          name: flutter-apk
          path: dist/

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/

      - name: Rename APK files for release
        run: |
          mv dist/app-debug.apk dist/DrAstro-Capacitor-Mobile.apk || true
          mv dist/app-release.apk dist/DrAstro-Flutter-Mobile.apk || true

      - name: Generate Release Tag
        id: generate_tag
        run: echo "release_tag=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.release_tag }}
          name: Dr. Astro Release ${{ env.release_tag }}
          body: |
            # Dr. Astro App Releases — ${{ env.release_tag }} 🌟
            
            ## 📥 Downloads
            
            ### 📱 Mobile Apps (Android)
            * **DrAstro-Capacitor-Mobile.apk** — Main Android app (Next.js + Capacitor)
            * **DrAstro-Flutter-Mobile.apk** — Flutter native Android build
            
            ### 🪟 Windows Desktop
            * **DrAstro-Setup.exe** — Windows installer (Electron-based)
            
            ---
            *Built automatically by GitHub Actions CI/CD.*
          draft: false
          prerelease: false
          files: |
            dist/DrAstro-Capacitor-Mobile.apk
            dist/DrAstro-Flutter-Mobile.apk
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
