name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Next.js & Capacitor Sync
        run: npm run build-mobile

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Generate Release Tag
        id: generate_tag
        run: echo "release_tag=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.release_tag }}
          name: Dr. Astro Release ${{ env.release_tag }}
          body: |
            # Dr. Astro - Mobile Native App Release
            
            This release features the brand identity implementation and custom splash screen updates:
            - **Universal Logo:** Replaced stethoscope icons with the custom transparent bodybuilder insignia.
            - **Adaptive Suite:** Packaged 32x32, 192x192, and 512x512 icons, Apple touch icons, and favicons.
            - **Premium Minimalist Splash:** Styled dynamic loaders with an obsidian background (`bg-neutral-950`) and a silver-toned metallic filter logo.
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
