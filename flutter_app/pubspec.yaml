name: dr_astro
description: Dr. Astro — Medical Education Platform. A cross-platform app for MBBS students featuring subject libraries, exam prep, AI chat, and more.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2

  # PDF Viewer
  flutter_pdfview: ^1.3.2

  # Markdown Renderer
  flutter_markdown: ^0.7.4+1

  # Local Storage
  shared_preferences: ^2.3.4

  # Networking
  dio: ^5.7.0

  # URL Launcher (for opening download links)
  url_launcher: ^6.3.1

  # Image Picking (Admin - upload cover images)
  image_picker: ^1.1.2

  # Intl / Date Formatting
  intl: ^0.19.0

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icons/app_icon_transparent.png
  android: true
  ios: true
  web: false
